function updateAimJoystick(event) {
  const rect = elAimJoystick.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  let dx = event.clientX - centerX;
  let dy = event.clientY - centerY;
  const radius = rect.width * 0.38;
  const distance = Math.hypot(dx, dy);
  if (distance > radius) {
    dx = dx / distance * radius;
    dy = dy / distance * radius;
  }
  elAimKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  if (Math.hypot(dx, dy) > 4) {
    const stickAngle = Math.atan2(dy, dx);
    if (joystickLastAngle !== null) {
      let delta = stickAngle - joystickLastAngle;
      delta = Math.atan2(Math.sin(delta), Math.cos(delta));
      aimAngle += delta * 0.28;
      clampAimToLockedJumpTarget();
    }
    joystickLastAngle = stickAngle;
  } else {
    joystickLastAngle = null;
  }
}

function startAimJoystick(event) {
  joystickLastAngle = Math.atan2(Math.cos(aimAngle), -Math.sin(aimAngle));
  elAimKnob.style.transform = 'translate(0, 0)';
}

function resetAimJoystick() {
  joystickPointerId = null;
  joystickLastAngle = null;
}

function formatCurveAngle(value) {
  return `${Number.isInteger(value) ? value : value.toFixed(1)}°`;
}

function updateSkillUI() {
  const enabled = canUseSkills();
  const curveActive = enabled && skills.arc;
  const jumpActive = enabled && skills.jump;
  elSkillDock.classList.toggle('hidden', !enabled);
  elSkillJump.disabled = !enabled;
  elSkillCurve.disabled = !enabled;
  elSkillJump.classList.toggle('active', jumpActive);
  elSkillLock.hidden = !jumpActive || !skills.jumpLocked;
  elSkillLock.disabled = !jumpActive || !skills.jumpLocked;
  elSkillLock.classList.toggle('active', jumpActive && skills.jumpLocked);
  elSkillLockName.textContent = '解锁';
  elSkillCurve.classList.toggle('active', curveActive);
  elCurveControl.classList.toggle('show', curveActive);
  elCurveAngle.disabled = !curveActive;
  elCurveAngle.value = String(skills.curveAngle);
  elCurveAngleLabel.textContent = formatCurveAngle(skills.curveAngle);
  updateMobileControls();
}

function toggleSkill(type) {
  if (!canUseSkills()) return;
  cancelShotDrag();
  if (type === 'jump') skills.jump = !skills.jump;
  if (type === 'curve') skills.arc = !skills.arc;
  if (type === 'jump') {
    skills.jumpTarget = null;
    skills.jumpLocked = false;
  }

  if (skills.jump && skills.arc) {
    state.msg = `跳球 + 弧球：越过全部阻挡后，目标球转弯 ${formatCurveAngle(skills.curveAngle)}`;
  } else if (skills.jump) {
    state.msg = '跳球已启用：请直接点选要跳到的目标球';
  } else if (skills.arc) {
    state.msg = `弧球已启用：目标球将转弯 ${formatCurveAngle(skills.curveAngle)}`;
  } else {
    state.msg = '技能已取消';
  }

  updateHUD();
}

function toggleJumpLock() {
  if (!canUseSkills() || !skills.jump) return;
  cancelShotDrag();

  if (skills.jumpLocked) {
    skills.jumpLocked = false;
    skills.jumpTarget = null;
    state.msg = '跳球目标已解锁，请重新点选目标球';
    updateHUD();
    return;
  }

  state.msg = '请直接点选需要跳到的目标球';
  updateHUD();
}

function selectJumpTargetAt(point) {
  if (!skills.jump) return false;
  let selected = null;
  let bestDistance = 30;
  for (const ball of balls) {
    if (ball.pocketed || ball === cueBall) continue;
    const distance = Math.hypot(point.x - ball.x, point.y - ball.y);
    if (distance < bestDistance) {
      bestDistance = distance;
      selected = ball;
    }
  }
  if (!selected) return false;
  skills.jumpTarget = selected;
  skills.jumpLocked = true;
  aimAngle = Math.atan2(selected.y - cueBall.y, selected.x - cueBall.x);
  state.msg = `已锁定 ${selected.num} 号球，可微调虚线`;
  updateHUD();
  return true;
}

/* ==================== 头像球组图标 ==================== */
function renderBallStrip(index, element) {
  element.innerHTML = '';
  const group = state.groups[index];
  if (!group) return;

  const remaining = balls
    .filter(ball => ball.type === group && !ball.pocketed)
    .sort((a, b) => a.num - b.num);

  for (const ball of remaining) {
    const icon = document.createElement('span');
    icon.className = 'mini-ball';
    icon.dataset.num = String(ball.num);
    icon.title = `${ball.num} 号球`;
    icon.style.background = group === 'stripe'
      ? `linear-gradient(180deg, #f7f5ee 0 27%, ${ball.color} 27% 73%, #f7f5ee 73%)`
      : ball.color;
    element.appendChild(icon);
  }
}

/* ==================== 瞄准预测（延长线） ==================== */
function raycast(origin, dir, ignore) {
  let bestT = Infinity, bestBall = null;

  for (const b of balls) {
    if (b.pocketed || b === ignore || (Array.isArray(ignore) && ignore.includes(b))) continue;
    const ox = origin.x - b.x, oy = origin.y - b.y;
    const rr = 2 * R;
    const bq = ox * dir.x + oy * dir.y;
    const c = ox * ox + oy * oy - rr * rr;
    const disc = bq * bq - c;
    if (disc < 0) continue;
    const sq = Math.sqrt(disc);
    let t = -bq - sq;
    if (t < 0) t = -bq + sq;
    if (t < 1e-6) continue;
    if (t < bestT) { bestT = t; bestBall = b; }
  }

  let tw = Infinity;
  if (dir.x > 1e-9) tw = Math.min(tw, (TR - R - origin.x) / dir.x);
  if (dir.x < -1e-9) tw = Math.min(tw, (TL + R - origin.x) / dir.x);
  if (dir.y > 1e-9) tw = Math.min(tw, (TB - R - origin.y) / dir.y);
  if (dir.y < -1e-9) tw = Math.min(tw, (TT + R - origin.y) / dir.y);
  if (tw < 0) tw = 0;

  if (tw < bestT) return { t: tw, ball: null };
  return { t: bestT, ball: bestBall };
}

function firstCircleHit(origin, dir, centerX, centerY, radius) {
  const ox = origin.x - centerX;
  const oy = origin.y - centerY;
  const b = ox * dir.x + oy * dir.y;
  const c = ox * ox + oy * oy - radius * radius;
  const discriminant = b * b - c;
  if (discriminant < 0) return Infinity;
  const root = Math.sqrt(discriminant);
  const near = -b - root;
  if (near > 1e-6) return near;
  const far = -b + root;
  return far > 1e-6 ? far : Infinity;
}

function wallHitDistance(origin, dir) {
  let distance = Infinity;
  if (dir.x > 1e-9) distance = Math.min(distance, (TR - R - origin.x) / dir.x);
  if (dir.x < -1e-9) distance = Math.min(distance, (TL + R - origin.x) / dir.x);
  if (dir.y > 1e-9) distance = Math.min(distance, (TB - R - origin.y) / dir.y);
  if (dir.y < -1e-9) distance = Math.min(distance, (TT + R - origin.y) / dir.y);
  return Math.max(0, distance);
}

function traceBallPath(origin, dir, ignored, maxBounces = 4) {
  const points = [{ x: origin.x, y: origin.y }];
  let current = { x: origin.x, y: origin.y };
  let velocity = { x: dir.x, y: dir.y };

  for (let bounce = 0; bounce <= maxBounces; bounce++) {
    const ballHit = raycast(current, velocity, ignored);
    const wallDistance = wallHitDistance(current, velocity);

    let pocketHit = null;
    let pocketDistance = Infinity;
    for (const pocket of POCKETS) {
      const distance = firstCircleHit(current, velocity, pocket.x, pocket.y, pocket.r);
      if (distance < pocketDistance) {
        pocketDistance = distance;
        pocketHit = pocket;
      }
    }

    if (ballHit.ball && ballHit.t <= pocketDistance && ballHit.t <= wallDistance + 1e-6) {
      points.push({
        x: current.x + velocity.x * ballHit.t,
        y: current.y + velocity.y * ballHit.t
      });
      return { points, ball: ballHit.ball, pocket: null };
    }

    if (pocketHit && pocketDistance < wallDistance) {
      points.push({
        x: current.x + velocity.x * (pocketDistance + pocketHit.r * 0.35),
        y: current.y + velocity.y * (pocketDistance + pocketHit.r * 0.35)
      });
      return { points, ball: null, pocket: pocketHit };
    }

    if (!Number.isFinite(wallDistance) || wallDistance > 5000) {
      return { points, ball: null, pocket: null };
    }

    current = {
      x: current.x + velocity.x * wallDistance,
      y: current.y + velocity.y * wallDistance
    };
    points.push({ x: current.x, y: current.y });

    const hitVertical = current.x <= TL + R + 0.01 || current.x >= TR - R - 0.01;
    const hitHorizontal = current.y <= TT + R + 0.01 || current.y >= TB - R - 0.01;
    if (hitVertical) velocity.x *= -1;
    if (hitHorizontal) velocity.y *= -1;
  }

  return { points, ball: null, pocket: null };
}

function segmentCircleHitT(ax, ay, bx, by, centerX, centerY, radius) {
  const dx = bx - ax;
  const dy = by - ay;
  const fx = ax - centerX;
  const fy = ay - centerY;
  const a = dx * dx + dy * dy;
  if (a < 1e-9) return Infinity;
  const b = 2 * (fx * dx + fy * dy);
  const c = fx * fx + fy * fy - radius * radius;
  const discriminant = b * b - 4 * a * c;
  if (discriminant < 0) return Infinity;
  const root = Math.sqrt(discriminant);
  const near = (-b - root) / (2 * a);
  if (near >= 0 && near <= 1) return near;
  const far = (-b + root) / (2 * a);
  return far >= 0 && far <= 1 ? far : Infinity;
}

function traceCurvePath(
  origin,
  dir,
  side,
  ignored = [],
  curveDistance = CURVE_MAX_DISTANCE,
  curveRate = CURVE_CURVATURE
) {
  const points = [{ x: origin.x, y: origin.y }];
  let current = { x: origin.x, y: origin.y };
  let velocity = { x: dir.x, y: dir.y };
  let minimumClearance = Infinity;
  const pathLimit = Math.min(CURVE_MAX_DISTANCE, curveDistance + 720);

  for (let distance = 0; distance < pathLimit; distance += CURVE_PATH_STEP) {
    const turningDistance = Math.min(CURVE_PATH_STEP, Math.max(0, curveDistance - distance));
    const angle = side * curveRate * turningDistance;
    const cosine = Math.cos(angle);
    const sine = Math.sin(angle);
    const nextVelocity = {
      x: velocity.x * cosine - velocity.y * sine,
      y: velocity.x * sine + velocity.y * cosine
    };
    const next = {
      x: current.x + nextVelocity.x * CURVE_PATH_STEP,
      y: current.y + nextVelocity.y * CURVE_PATH_STEP
    };

    let earliestBall = null;
    let earliestBallT = Infinity;
    let earliestPocket = null;
    let earliestPocketT = Infinity;

    for (const ball of balls) {
      if (ball.pocketed || ball === origin || ignored.includes(ball)) continue;
      const clearance = pointSegmentDistance(ball.x, ball.y, current.x, current.y, next.x, next.y) - 2 * R;
      minimumClearance = Math.min(minimumClearance, clearance);
      const hitT = segmentCircleHitT(current.x, current.y, next.x, next.y, ball.x, ball.y, 2 * R);
      if (hitT < earliestBallT) {
        earliestBallT = hitT;
        earliestBall = ball;
      }
    }

    for (const pocket of POCKETS) {
      const hitT = segmentCircleHitT(current.x, current.y, next.x, next.y, pocket.x, pocket.y, pocket.r);
      if (hitT < earliestPocketT) {
        earliestPocketT = hitT;
        earliestPocket = pocket;
      }
    }

    const segmentX = next.x - current.x;
    const segmentY = next.y - current.y;
    let wallT = Infinity;
    if (segmentX > 1e-9) wallT = Math.min(wallT, (TR - R - current.x) / segmentX);
    if (segmentX < -1e-9) wallT = Math.min(wallT, (TL + R - current.x) / segmentX);
    if (segmentY > 1e-9) wallT = Math.min(wallT, (TB - R - current.y) / segmentY);
    if (segmentY < -1e-9) wallT = Math.min(wallT, (TT + R - current.y) / segmentY);
    if (wallT < 0) wallT = Infinity;

    if (earliestBall && earliestBallT <= earliestPocketT && earliestBallT <= wallT) {
      points.push({
        x: current.x + segmentX * earliestBallT,
        y: current.y + segmentY * earliestBallT
      });
      return {
        points,
        ball: earliestBall,
        pocket: null,
        clearance: 0,
        distance: distance + CURVE_PATH_STEP * earliestBallT
      };
    }

    if (earliestPocket && earliestPocketT <= wallT) {
      const travel = earliestPocketT + (1 - earliestPocketT) * 0.08;
      points.push({
        x: current.x + segmentX * travel,
        y: current.y + segmentY * travel
      });
      return {
        points,
        ball: null,
        pocket: earliestPocket,
        clearance: minimumClearance,
        distance: distance + CURVE_PATH_STEP * travel
      };
    }

    if (wallT <= 1) {
      const wallPoint = {
        x: current.x + segmentX * wallT,
        y: current.y + segmentY * wallT
      };
      points.push(wallPoint);

      if (wallPoint.x <= TL + R + 0.01 && nextVelocity.x < 0) nextVelocity.x *= -1;
      if (wallPoint.x >= TR - R - 0.01 && nextVelocity.x > 0) nextVelocity.x *= -1;
      if (wallPoint.y <= TT + R + 0.01 && nextVelocity.y < 0) nextVelocity.y *= -1;
      if (wallPoint.y >= TB - R - 0.01 && nextVelocity.y > 0) nextVelocity.y *= -1;

      current = wallPoint;
      velocity = nextVelocity;
      distance -= CURVE_PATH_STEP * (1 - wallT);
      continue;
    }

    current = next;
    velocity = nextVelocity;
    points.push(next);
  }

  return {
    points,
    ball: null,
    pocket: null,
    clearance: Number.isFinite(minimumClearance) ? minimumClearance : 999,
    distance: pathLimit
  };
}

function findJumpTarget(dir, forcedTarget = null, locked = false) {
  const candidates = [];

  for (const ball of balls) {
    if (ball.pocketed || ball === cueBall) continue;
    const relX = ball.x - cueBall.x;
    const relY = ball.y - cueBall.y;
    const along = relX * dir.x + relY * dir.y;
    if (along <= 2 * R) continue;
    const perpendicular = Math.abs(relX * dir.y - relY * dir.x);
    if (perpendicular > 2 * R * (locked ? 0.995 : 0.96)) continue;
    candidates.push({ ball, along });
  }

  if (candidates.length === 0) return { target: null, skipped: [] };

  if (forcedTarget && !forcedTarget.pocketed) {
    const forcedCandidate = candidates.find(item => item.ball === forcedTarget);
    if (forcedCandidate) {
      return {
        target: forcedTarget,
        skipped: candidates
          .filter(item => item.ball !== forcedTarget && item.along < forcedCandidate.along)
          .map(item => item.ball)
      };
    }
  }

  candidates.sort((a, b) => b.along - a.along);
  const target = candidates[0].ball;
  const skipped = candidates.slice(1).map(item => item.ball);
  return { target, skipped };
}

function clampAimToLockedJumpTarget() {
  const target = skills.jumpTarget;
  if (!skills.jump || !skills.jumpLocked || !target || target.pocketed) return;

  const centerAngle = Math.atan2(target.y - cueBall.y, target.x - cueBall.x);
  const distance = Math.hypot(target.x - cueBall.x, target.y - cueBall.y);
  if (distance <= 2 * R) {
    aimAngle = centerAngle;
    return;
  }

  const halfWindow = Math.asin(Math.min(0.995, 2 * R * 0.94 / distance));
  let difference = aimAngle - centerAngle;
  difference = Math.atan2(Math.sin(difference), Math.cos(difference));
  aimAngle = centerAngle + clamp(difference, -halfWindow, halfWindow);
}

function sampleJumpPath(startX, startY, endX, endY, height, segments = 28) {
  const controlX = (startX + endX) / 2;
  const controlY = (startY + endY) / 2 - height * 1.45;
  const points = [];
  for (let index = 0; index <= segments; index++) {
    const t = index / segments;
    const inverse = 1 - t;
    points.push({
      x: inverse * inverse * startX + 2 * inverse * t * controlX + t * t * endX,
      y: inverse * inverse * startY + 2 * inverse * t * controlY + t * t * endY
    });
  }
  return points;
}

function computeAim() {
  const dir = { x: Math.cos(aimAngle), y: Math.sin(aimAngle) };
  const overlappingBalls = balls.filter(ball =>
    ball !== cueBall &&
    !ball.pocketed &&
    Math.hypot(ball.x - cueBall.x, ball.y - cueBall.y) < 2 * R - 0.5
  );
  const predictionIgnore = [cueBall, ...overlappingBalls];
  let hit;
  let jumpBall = null;
  let jumpBalls = [];
  let mainPath = null;

  hit = raycast(cueBall, dir, predictionIgnore);
  if (skills.jump && skills.jumpLocked && skills.jumpTarget && hit.ball) {
    const jumpPlan = findJumpTarget(dir, skills.jumpTarget, skills.jumpLocked);
    if (jumpPlan.target) {
      jumpBall = jumpPlan.target;
      jumpBalls = jumpPlan.skipped;
      hit = raycast(cueBall, dir, [cueBall, ...overlappingBalls, ...jumpBalls]);
    }
  }
  let hitDistance = hit.t;
  if (!Number.isFinite(hitDistance) || hitDistance < 1) {
    hitDistance = wallHitDistance(cueBall, dir);
  }
  if (!Number.isFinite(hitDistance) || hitDistance < 1) hitDistance = 240;
  let mainPocket = null;
  if (!hit.ball) {
    let bestPocketDistance = Infinity;
    for (const pocket of POCKETS) {
      const pocketDistance = firstCircleHit(cueBall, dir, pocket.x, pocket.y, pocket.r);
      if (pocketDistance < hitDistance && pocketDistance < bestPocketDistance) {
        bestPocketDistance = pocketDistance;
        mainPocket = pocket;
      }
    }
    if (mainPocket) hitDistance = bestPocketDistance + mainPocket.r * 0.35;
  }
  const contactX = cueBall.x + dir.x * hitDistance;
  const contactY = cueBall.y + dir.y * hitDistance;
  mainPath = jumpBall
    ? sampleJumpPath(
      cueBall.x,
      cueBall.y,
      contactX,
      contactY,
      Math.min(62, 26 + jumpBalls.length * 10)
    )
    : [
      { x: cueBall.x, y: cueBall.y },
      { x: contactX, y: contactY }
    ];

  const contact = {
    x: mainPath[mainPath.length - 1].x,
    y: mainPath[mainPath.length - 1].y
  };
  const out = {
    dir,
    contact,
    mainPath,
    targetBall: hit.ball,
    targetPath: null,
    cuePath: null,
    jumpBall,
    jumpBalls,
    pocket: mainPocket
  };

  if (hit.ball) {
    const target = hit.ball;
    const normalX = (target.x - contact.x) / (2 * R);
    const normalY = (target.y - contact.y) / (2 * R);
    const normalLength = Math.hypot(normalX, normalY) || 1;
    const objectDir = { x: normalX / normalLength, y: normalY / normalLength };
    if (skills.arc && skills.curveAngle !== 0) {
      const angle = Math.abs(skills.curveAngle) * Math.PI / 180;
      out.targetPath = traceCurvePath(
        target,
        objectDir,
        Math.sign(skills.curveAngle),
        [target],
        ARC_TURN_DISTANCE,
        angle / ARC_TURN_DISTANCE
      );
    } else {
      out.targetPath = traceBallPath(target, objectDir, [target], 4);
    }

    const normalSpeed = dir.x * objectDir.x + dir.y * objectDir.y;
    const transfer = (1 + BALL_RESTITUTION) / 2;
    let cueX = dir.x - transfer * normalSpeed * objectDir.x;
    let cueY = dir.y - transfer * normalSpeed * objectDir.y;
    const cueLength = Math.hypot(cueX, cueY);
    if (cueLength > 0.002) {
      cueX /= cueLength;
      cueY /= cueLength;
      out.cuePath = traceBallPath(contact, { x: cueX, y: cueY }, [cueBall, target], 4);
    }
  } else {
    if (skills.jump) {
      out.cuePath = null;
    } else {
      out.cuePath = traceBallPath(cueBall, dir, predictionIgnore, 4);
    }
  }

  return out;
}

/* ==================== 绘制 ==================== */
function drawTable() {
  // 木框
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.65)';
  ctx.shadowBlur = 34;
  ctx.shadowOffsetY = 12;
  const woodGrad = ctx.createLinearGradient(0, TT - 40, 0, TB + 40);
  woodGrad.addColorStop(0, '#5a3620');
  woodGrad.addColorStop(0.5, '#3b2416');
  woodGrad.addColorStop(1, '#2a180d');
  ctx.fillStyle = woodGrad;
  roundRect(ctx, TL - 40, TT - 40, TW + 80, TH + 80, 26);
  ctx.fill();
  ctx.restore();

  // 台呢
  const feltGrad = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, 560);
  feltGrad.addColorStop(0, '#1d8450');
  feltGrad.addColorStop(1, '#0d4f30');
  ctx.fillStyle = feltGrad;
  ctx.fillRect(TL, TT, TW, TH);

  // 内阴影
  ctx.save();
  ctx.strokeStyle = 'rgba(0,0,0,.35)';
  ctx.lineWidth = 10;
  ctx.strokeRect(TL + 5, TT + 5, TW - 10, TH - 10);
  ctx.restore();

  // 开球线
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.10)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([6, 8]);
  ctx.beginPath();
  ctx.moveTo(TL + TW * 0.25, TT);
  ctx.lineTo(TL + TW * 0.25, TB);
  ctx.stroke();
  ctx.restore();

  // 袋口
  for (const p of POCKETS) {
    const radius = p.r || POCKET_R;
    const g = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, radius);
    g.addColorStop(0, '#000000');
    g.addColorStop(0.7, '#04100a');
    g.addColorStop(1, '#0b1d13');
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,.8)';
    ctx.lineWidth = 3;
    ctx.stroke();
  }
}

function drawBall(b) {
  if (b.pocketed) return;
  const { x, y } = b;
  const jumpOffset = b.jumpAnimation
    ? Math.sin(clamp(
      ((x - b.jumpAnimation.startX) * (b.jumpAnimation.endX - b.jumpAnimation.startX) +
        (y - b.jumpAnimation.startY) * (b.jumpAnimation.endY - b.jumpAnimation.startY)) /
      Math.max(1, Math.hypot(
        b.jumpAnimation.endX - b.jumpAnimation.startX,
        b.jumpAnimation.endY - b.jumpAnimation.startY
      ) ** 2),
      0,
      1
    ) * Math.PI) * b.jumpAnimation.height
    : 0;
  const drawY = y - jumpOffset;

  // 阴影
  ctx.beginPath();
  ctx.ellipse(
    x + 2.5,
    y + 3.5,
    R * (1.02 + jumpOffset / 95),
    R * (0.9 + jumpOffset / 150),
    0,
    0,
    Math.PI * 2
  );
  ctx.fillStyle = 'rgba(0,0,0,.32)';
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(x, drawY, R, 0, Math.PI * 2);
  ctx.clip();

  ctx.fillStyle = b.type === 'cue' || b.type === 'stripe' ? '#f8f6ef' : b.color;
  ctx.fillRect(x - R, drawY - R, 2 * R, 2 * R);

  ctx.translate(x, drawY);
  ctx.rotate(b.angle || 0);

  if (b.type === 'stripe') {
    ctx.fillStyle = b.color;
    ctx.fillRect(-R, -R * 0.60, 2 * R, R * 1.20);
  } else if (b.type === 'cue') {
    ctx.fillStyle = 'rgba(216,74,66,.78)';
    ctx.beginPath();
    ctx.arc(R * 0.46, -R * 0.10, R * 0.19, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(54,107,186,.62)';
    ctx.beginPath();
    ctx.arc(-R * 0.34, R * 0.28, R * 0.11, 0, Math.PI * 2);
    ctx.fill();
  }

  if (b.num > 0) {
    ctx.beginPath();
    ctx.arc(0, 0, R * 0.53, 0, Math.PI * 2);
    ctx.fillStyle = '#fbfbf6';
    ctx.fill();

    ctx.fillStyle = '#141414';
    ctx.font = `bold ${Math.round(R * 0.78)}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(b.num), 0, 0.5);
  }

  ctx.restore();

  // 立体高光保持固定，体现光源方向。
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, drawY, R, 0, Math.PI * 2);
  ctx.clip();
  const hg = ctx.createRadialGradient(x - R * 0.38, drawY - R * 0.42, 1, x, drawY, R * 1.35);
  hg.addColorStop(0, 'rgba(255,255,255,.60)');
  hg.addColorStop(0.42, 'rgba(255,255,255,0)');
  hg.addColorStop(1, 'rgba(0,0,0,.42)');
  ctx.fillStyle = hg;
  ctx.fillRect(x - R, drawY - R, 2 * R, 2 * R);
  ctx.restore();

  ctx.beginPath();
  ctx.arc(x, drawY, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawPredictionPath(points, startColor, endColor, width, dash) {
  const validPoints = (points || []).filter(point =>
    Number.isFinite(point.x) && Number.isFinite(point.y)
  );
  if (validPoints.length < 2) return;
  const start = validPoints[0];
  const end = validPoints[validPoints.length - 1];
  let strokeStyle = startColor;
  if (Math.hypot(end.x - start.x, end.y - start.y) > 0.5) {
    const gradient = ctx.createLinearGradient(start.x, start.y, end.x, end.y);
    gradient.addColorStop(0, startColor);
    gradient.addColorStop(1, endColor);
    strokeStyle = gradient;
  }

  ctx.beginPath();
  ctx.moveTo(start.x, start.y);
  for (let index = 1; index < validPoints.length; index++) {
    ctx.lineTo(validPoints[index].x, validPoints[index].y);
  }
  ctx.strokeStyle = strokeStyle;
  ctx.lineWidth = width;
  ctx.setLineDash(dash);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function drawAim() {
  if (state.phase !== 'aim') return;

  const aim = computeAim();
  const dir = aim.dir;
  const contact = aim.contact;
  const mainPoints = aim.mainPath.map(point => ({ x: point.x, y: point.y }));
  if (mainPoints.length > 1) {
    const start = mainPoints[0];
    const next = mainPoints[1];
    const length = Math.hypot(next.x - start.x, next.y - start.y) || 1;
    mainPoints[0] = {
      x: start.x + (next.x - start.x) / length * R,
      y: start.y + (next.y - start.y) / length * R
    };
  }

  ctx.save();

  drawPredictionPath(mainPoints, 'rgba(255,255,255,.98)', 'rgba(255,255,255,.56)', 1.6, [6, 6]);

  for (const ball of aim.jumpBalls || []) {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, R + 7, Math.PI, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,207,80,.48)';
    ctx.lineWidth = 1.8;
    ctx.setLineDash([4, 3]);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,223,138,.68)';
    ctx.font = 'bold 10px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('跳', ball.x, ball.y - R - 9);
  }

  if (aim.jumpBall) {
    ctx.beginPath();
    ctx.arc(aim.jumpBall.x, aim.jumpBall.y, R + 10, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,207,80,.98)';
    ctx.lineWidth = 2.6;
    ctx.setLineDash([5, 3]);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,229,147,.98)';
    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText('目标', aim.jumpBall.x, aim.jumpBall.y - R - 13);
  }

  ctx.beginPath();
  ctx.arc(contact.x, contact.y, R, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,.58)';
  ctx.lineWidth = 1.2;
  ctx.setLineDash([3, 3]);
  ctx.stroke();

  if (aim.targetPath) {
    const arcPreview = skills.arc;
    drawPredictionPath(
      aim.targetPath.points,
      arcPreview ? 'rgba(98,230,165,.98)' : 'rgba(255,214,60,.96)',
      arcPreview ? 'rgba(98,230,165,.28)' : 'rgba(255,214,60,.25)',
      1.9,
      [7, 7]
    );
  }

  if (aim.cuePath) {
    drawPredictionPath(aim.cuePath.points, 'rgba(120,220,255,.82)', 'rgba(120,220,255,.14)', 1.35, [5, 8]);
  }

  for (const path of [aim.targetPath, aim.cuePath]) {
    if (!path || path.points.length < 2) continue;
    const endpoint = path.points[path.points.length - 1];
    if (path.pocket) {
      ctx.beginPath();
      ctx.arc(endpoint.x, endpoint.y, path.pocket.r * 0.55, 0, Math.PI * 2);
      ctx.strokeStyle = path === aim.targetPath ? 'rgba(255,214,60,.9)' : 'rgba(120,220,255,.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([]);
      ctx.stroke();
    } else if (path.ball) {
      ctx.beginPath();
      ctx.arc(endpoint.x, endpoint.y, 2.6, 0, Math.PI * 2);
      ctx.fillStyle = path === aim.targetPath ? 'rgba(255,214,60,.9)' : 'rgba(120,220,255,.8)';
      ctx.fill();
    }
  }

  if (skills.arc && aim.targetBall) {
    const target = aim.targetBall;
    const startAngle = Math.atan2(target.y - contact.y, target.x - contact.x);
    const turnAngle = skills.curveAngle * Math.PI / 180;
    const endAngle = startAngle + turnAngle;
    const radius = R + 13;

    ctx.beginPath();
    ctx.arc(target.x, target.y, radius, startAngle, endAngle, turnAngle < 0);
    ctx.strokeStyle = 'rgba(98,230,165,.98)';
    ctx.lineWidth = 2.4;
    ctx.setLineDash([4, 3]);
    ctx.stroke();

    const labelAngle = startAngle + turnAngle / 2;
    ctx.fillStyle = 'rgba(168,255,211,.98)';
    ctx.font = 'bold 10px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(
      formatCurveAngle(skills.curveAngle),
      target.x + Math.cos(labelAngle) * (radius + 13),
      target.y + Math.sin(labelAngle) * (radius + 13)
    );
  }

  ctx.restore();
}

function drawCue() {
  if (state.phase !== 'aim') return;

  const dir = { x: Math.cos(aimAngle), y: Math.sin(aimAngle) };
  const pull = 16 + power * 112;
  const sx = cueBall.x - dir.x * (R + pull);
  const sy = cueBall.y - dir.y * (R + pull);
  const cueLen = 240;
  const ex = sx - dir.x * cueLen;
  const ey = sy - dir.y * cueLen;

  ctx.save();
  ctx.lineCap = 'round';

  // 杆身
  const g = ctx.createLinearGradient(sx, sy, ex, ey);
  g.addColorStop(0, '#f0e2c4');
  g.addColorStop(0.12, '#d8c396');
  g.addColorStop(0.55, '#a97d43');
  g.addColorStop(1, '#4a2a12');
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(ex, ey);
  ctx.strokeStyle = g;
  ctx.lineWidth = 6;
  ctx.stroke();

  // 皮头
  ctx.beginPath();
  ctx.moveTo(sx, sy);
  ctx.lineTo(sx - dir.x * 8, sy - dir.y * 8);
  ctx.strokeStyle = '#2f6fb5';
  ctx.lineWidth = 7;
  ctx.stroke();

  ctx.restore();
}

function drawPowerBar() {
  if ((!draggingCue && (!useTouchControls() || mobilePower <= 0)) || state.phase !== 'aim') return;

  const bw = 190, bh = 11;
  const bx = W / 2 - bw / 2;
  const by = H - 24;

  ctx.save();
  roundRect(ctx, bx, by, bw, bh, 6);
  ctx.fillStyle = 'rgba(0,0,0,.5)';
  ctx.fill();

  const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, '#38d97a');
  g.addColorStop(0.5, '#f5d518');
  g.addColorStop(1, '#e8452c');
  ctx.save();
  roundRect(ctx, bx, by, bw, bh, 6);
  ctx.clip();
  ctx.fillStyle = g;
  ctx.fillRect(bx, by, bw * power, bh);
  ctx.restore();

  roundRect(ctx, bx, by, bw, bh, 6);
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,.78)';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText(`力度 ${Math.round(power * 100)}%`, bx, by - 4);
  ctx.restore();
}

function drawBallInHand() {
  if (state.phase !== 'ballinhand' || state.player !== 0) return;

  const valid = canPlaceCue(mouse.x, mouse.y);
  ctx.save();
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, R + 3, 0, Math.PI * 2);
  ctx.setLineDash([4, 4]);
  ctx.strokeStyle = valid ? 'rgba(90,255,150,.9)' : 'rgba(255,80,80,.9)';
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawEffects() {
  ctx.save();
  for (const effect of effects) {
    const alpha = clamp(effect.life / effect.maxLife, 0, 1);
    if (effect.type === 'ring') {
      const progress = 1 - alpha;
      ctx.beginPath();
      ctx.arc(effect.x, effect.y, effect.radius + (effect.maxRadius - effect.radius) * progress, 0, Math.PI * 2);
      ctx.strokeStyle = effect.color;
      ctx.globalAlpha = alpha * 0.85;
      ctx.lineWidth = 2.6;
      ctx.stroke();
    } else if (effect.type === 'particle') {
      ctx.beginPath();
      ctx.arc(effect.x, effect.y, effect.size * alpha, 0, Math.PI * 2);
      ctx.fillStyle = effect.color;
      ctx.globalAlpha = alpha;
      ctx.fill();
    } else if (effect.type === 'label') {
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 12px system-ui, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = effect.color;
      ctx.shadowBlur = 12;
      ctx.fillText(effect.text, effect.x, effect.y);
    } else if (effect.type === 'firstPocket') {
      const progress = 1 - alpha;
      const scale = 0.72 + Math.min(progress * 4, 1) * 0.32;
      ctx.save();
      ctx.translate(effect.x, effect.y - progress * 26);
      ctx.scale(scale, scale);
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'bold 14px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.fillText(effect.label, 0, -31);
      ctx.font = '900 58px system-ui, sans-serif';
      ctx.lineWidth = 9;
      ctx.strokeStyle = 'rgba(5,10,14,.82)';
      ctx.strokeText(effect.text, 0, 10);
      ctx.fillStyle = effect.color;
      ctx.shadowColor = effect.color;
      ctx.shadowBlur = 22;
      ctx.fillText(effect.text, 0, 10);
      ctx.restore();
    } else if (effect.type === 'combo') {
      const progress = 1 - alpha;
      const scale = 0.74 + Math.min(progress * 4.5, 1) * 0.26;
      ctx.save();
      ctx.translate(effect.x, effect.y - progress * 22);
      ctx.scale(scale, scale);
      ctx.globalAlpha = alpha;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      ctx.font = 'bold 13px system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.86)';
      ctx.fillText(effect.label, 0, -27);

      ctx.font = '900 48px system-ui, sans-serif';
      ctx.lineWidth = 8;
      ctx.strokeStyle = 'rgba(4,10,14,.78)';
      ctx.strokeText(effect.text, 0, 7);
      ctx.fillStyle = effect.color;
      ctx.shadowColor = effect.color;
      ctx.shadowBlur = 18;
      ctx.fillText(effect.text, 0, 7);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawGameOver() {
  if (state.phase !== 'over') return;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.62)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd83c';
  ctx.font = 'bold 54px system-ui, sans-serif';
  ctx.fillText(
    gameMode === 'practice' ? '练习完成' : `${state.winner === 0 ? '你' : '电脑 AI'} 获胜`,
    W / 2,
    H / 2 - 22
  );

  ctx.fillStyle = 'rgba(255,255,255,.75)';
  ctx.font = '18px system-ui, sans-serif';
  ctx.fillText(
    gameMode === 'practice' ? '点击画面重新开始练习' : '点击画面返回开始界面',
    W / 2,
    H / 2 + 44
  );
  ctx.restore();
}

function drawJumpTrail() {
  const animation = cueBall.jumpAnimation;
  if (!animation || cueBall.pocketed) return;

  const dx = animation.endX - animation.startX;
  const dy = animation.endY - animation.startY;
  const lengthSq = Math.max(1, dx * dx + dy * dy);
  const progress = clamp(
    ((cueBall.x - animation.startX) * dx + (cueBall.y - animation.startY) * dy) / lengthSq,
    0,
    1
  );
  const controlX = (animation.startX + animation.endX) / 2;
  const controlY = (animation.startY + animation.endY) / 2 - animation.height * 1.45;

  const pointAt = t => {
    const inverse = 1 - t;
    return {
      x: inverse * inverse * animation.startX + 2 * inverse * t * controlX + t * t * animation.endX,
      y: inverse * inverse * animation.startY + 2 * inverse * t * controlY + t * t * animation.endY
    };
  };

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(animation.startX, animation.startY);
  ctx.quadraticCurveTo(controlX, controlY, animation.endX, animation.endY);
  ctx.strokeStyle = 'rgba(255,216,92,.24)';
  ctx.lineWidth = 2;
  ctx.setLineDash([5, 6]);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(animation.startX, animation.startY);
  const segments = Math.max(2, Math.ceil(progress * 36));
  for (let index = 1; index <= segments; index++) {
    const point = pointAt(progress * index / segments);
    ctx.lineTo(point.x, point.y);
  }
  ctx.strokeStyle = 'rgba(255,229,128,.95)';
  ctx.lineWidth = 2.6;
  ctx.shadowColor = 'rgba(255,211,76,.8)';
  ctx.shadowBlur = 10;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(animation.endX, animation.endY, R + 4, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,222,104,.65)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([3, 4]);
  ctx.stroke();
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, W, H);

  drawTable();
  drawJumpTrail();

  for (const b of balls) {
    if (b === cueBall) continue;
    drawBall(b);
  }

  if (!cueBall.pocketed) drawBall(cueBall);

  drawCue();
  drawAim();
  drawEffects();
  drawBallInHand();
  drawPowerBar();
  drawGameOver();
}

/* ==================== 主循环 ==================== */
let lastTime = performance.now();

function loop(now) {
  if (isPagePaused || backgroundSimulationTimer) {
    lastTime = now;
    requestAnimationFrame(loop);
    return;
  }
  const dt = Math.min(Math.max((now - lastTime) / 1000, 0), MAX_FRAME_DT);
  lastTime = now;
  updateEffects(dt);

  if (state.phase === 'moving') {
    physicsAccumulator += dt;
    let steps = 0;

    while (physicsAccumulator >= PHYSICS_STEP && steps < MAX_PHYSICS_STEPS) {
      physicsStep(PHYSICS_STEP);
      physicsAccumulator -= PHYSICS_STEP;
      steps++;
    }

    if (steps === MAX_PHYSICS_STEPS) physicsAccumulator = 0;
    if (allStopped()) endShot();
  } else {
    physicsAccumulator = 0;
  }

  if (state.phase === 'ballinhand' && state.player === 0 && matchState === 'playing') {
    const previewX = clamp(mouse.x, TL + R, TR - R);
    const previewY = clamp(mouse.y, TT + R, TB - R);
    if (canPlaceCue(previewX, previewY)) {
      cueBall.x = previewX;
      cueBall.y = previewY;
      cueBall.pocketed = false;
    }
  }

  if (draggingCue && state.phase === 'aim' && state.player === 0) {
    updateDragPower(mouse);
  }

  render();
  requestAnimationFrame(loop);
}

/* ==================== 交互 ==================== */
function toCanvas(e) {
  const r = canvas.getBoundingClientRect();
  if (isMobileDevice && window.matchMedia('(max-width: 760px) and (orientation: portrait)').matches) {
    const scale = r.width / H;
    const rotatedX = (e.clientX - r.left) / scale;
    const rotatedY = (e.clientY - r.top) / scale;
    return {
      x: rotatedY,
      y: H - rotatedX
    };
  }
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}

function canPlaceCue(x, y) {
  if (x < TL + R || x > TR - R || y < TT + R || y > TB - R) return false;
  for (const p of POCKETS) {
    if (Math.hypot(x - p.x, y - p.y) < p.r + R * 0.25) return false;
  }
  for (const b of balls) {
    if (b === cueBall || b.pocketed) continue;
    if (len(b.x - x, b.y - y) < 2 * R + 1) return false;
  }
  return true;
}

function findFreeCuePosition() {
  const candidates = [{ x: TL + TW * 0.25, y: TT + TH / 2 }];
  for (let x = TL + 60; x <= TR - 60; x += 55) {
    for (let y = TT + 50; y <= TB - 50; y += 48) {
      candidates.push({ x, y });
    }
  }
  return candidates.find(candidate => canPlaceCue(candidate.x, candidate.y)) || {
    x: TL + TW * 0.25,
    y: TT + TH / 2
  };
}

function updatePointerPosition(e) {
  const p = toCanvas(e);
  mouse.x = p.x;
  mouse.y = p.y;
  return p;
}

function updateAimAngle() {
  if (matchState !== 'playing' || state.phase !== 'aim' || state.player !== 0 || draggingCue || state.aiThinking) return;
  const dx = mouse.x - cueBall.x;
  const dy = mouse.y - cueBall.y;
  if (Math.hypot(dx, dy) > 2) aimAngle = Math.atan2(dy, dx);
  clampAimToLockedJumpTarget();
}

function setDragging(active) {
  draggingCue = active;
  canvas.classList.toggle('dragging', active);
}

function updateDragPower(pointer) {
  const dirX = Math.cos(aimAngle);
  const dirY = Math.sin(aimAngle);
  const moveX = pointer.x - dragStart.x;
  const moveY = pointer.y - dragStart.y;
  const backwardDistance = Math.max(
    0,
    -(moveX * dirX + moveY * dirY) - PC_DRAG_DEAD_ZONE
  );
  const dragPower = 1 - Math.exp(-backwardDistance / PC_DRAG_RESPONSE_DISTANCE);
  const heldMs = Math.max(0, performance.now() - dragStartTime);
  const holdPower = Math.min(
    PC_HOLD_POWER_MAX,
    heldMs / PC_HOLD_RAMP_MS * PC_HOLD_POWER_MAX
  );
  power = clamp(Math.max(dragPower, holdPower), 0, 1);
}

function cancelShotDrag(message = '已取消击球') {
  if (!draggingCue) return;
  setDragging(false);
  power = 0;
  if (state.phase === 'aim') {
    state.msg = message;
    updateHUD();
  }
}

function releaseShot() {
  if (!draggingCue) return;

  const shotPower = power;
  const canShoot = state.phase === 'aim' && shotPower >= MIN_SHOT_POWER;
  setDragging(false);
  power = 0;

  if (!canShoot) {
    if (state.phase === 'aim') {
      state.msg = '蓄力不足，已取消击球';
      updateHUD();
    }
    return;
  }

  doShoot(shotPower);
}

canvas.addEventListener('pointermove', e => {
  const pointer = updatePointerPosition(e);
  if (draggingCue) updateDragPower(pointer);
  else updateAimAngle();
});

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  const p = updatePointerPosition(e);

  if (e.button === 2) {
    cancelShotDrag();
    return;
  }
  if (e.button !== 0) return;

  if (state.phase === 'over') {
    if (gameMode === 'practice') startPracticeMode();
    else showStartScreen();
    return;
  }
  if (matchState !== 'playing' || state.player !== 0) return;

  if (state.phase === 'ballinhand') {
    if (canPlaceCue(p.x, p.y)) {
      cueBall.x = p.x;
      cueBall.y = p.y;
      cueBall.vx = cueBall.vy = 0;
      cueBall.pocketed = false;
      state.phase = 'aim';
      state.msg = `${playerLabel(state.player)} 出杆`;
      updateHUD();
      aimAngle = Math.atan2(mouse.y - cueBall.y, mouse.x - cueBall.x);
    }
    return;
  }

  if (state.phase === 'aim') {
    if (selectJumpTargetAt(p)) return;
    if (useTouchControls()) return;
    updateAimAngle();
    setDragging(true);
    dragStart = { x: p.x, y: p.y };
    dragStartTime = performance.now();
    power = 0;
    state.msg = '按住开始蓄力，向后移动可快速增加力度';
    updateHUD();
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
  }
});

window.addEventListener('pointerup', e => {
  if (e.button !== 0) return;
  releaseShot();
});

canvas.addEventListener('pointercancel', () => cancelShotDrag());
window.addEventListener('blur', () => cancelShotDrag());
window.addEventListener('blur', handleWindowBlur);
window.addEventListener('focus', handleWindowFocus);
document.addEventListener('visibilitychange', handleVisibilityChange);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') cancelShotDrag();
  if (e.key.toLowerCase() === 'r' && !e.repeat) showStartScreen();
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

/* ==================== HUD ==================== */
const elMsg = document.getElementById('msg');
const elP1 = document.getElementById('p1');
const elP2 = document.getElementById('p2');
const elN1 = document.getElementById('n1');
const elN2 = document.getElementById('n2');
const elG1 = document.getElementById('g1');
const elG2 = document.getElementById('g2');
const elB1 = document.getElementById('b1');
const elB2 = document.getElementById('b2');
const elStartScreen = document.getElementById('startScreen');
const elDiceScreen = document.getElementById('diceScreen');
const elModeEight = document.getElementById('modeEight');
const elModePractice = document.getElementById('modePractice');
const elYourDie = document.getElementById('yourDie');
const elAiDie = document.getElementById('aiDie');
const elDiceResult = document.getElementById('diceResult');
const elSkillDock = document.getElementById('skillDock');
const elSkillJump = document.getElementById('skillJump');
const elSkillLock = document.getElementById('skillLock');
const elSkillLockName = document.getElementById('skillLockName');
const elSkillCurve = document.getElementById('skillCurve');
const elCurveControl = document.getElementById('curveControl');
const elCurveAngle = document.getElementById('curveAngle');
const elCurveAngleLabel = document.getElementById('curveAngleLabel');
const elMobileControls = document.getElementById('mobileControls');
const elAimJoystick = document.getElementById('aimJoystick');
const elAimKnob = document.getElementById('aimKnob');
const elMobilePower = document.getElementById('mobilePower');
const elMobilePowerLabel = document.getElementById('mobilePowerLabel');
const elMobileShoot = document.getElementById('mobileShoot');
const elControlTouch = document.getElementById('controlTouch');
const elControlMouse = document.getElementById('controlMouse');
const elSettingsButton = document.getElementById('settingsButton');
const elSettingsPanel = document.getElementById('settingsPanel');
const elSettingsClose = document.getElementById('settingsClose');
const elSkinPicker = document.getElementById('skinPicker');
const elSkinList = document.getElementById('skinList');
const elSkinClassic = document.getElementById('skinClassic');
const elSkinMonochrome = document.getElementById('skinMonochrome');

function updateHUD() {
  elMsg.textContent = state.msg;
  elP1.classList.toggle('active', matchState === 'playing' && state.player === 0 && state.phase !== 'over');
  elP2.classList.toggle('active', matchState === 'playing' && state.player === 1 && state.phase !== 'over');

  const g0 = state.groups[0];
  const g1 = state.groups[1];
  elG1.className = 'group-badge' + (g0 ? ` show ${g0}` : '');
  elG2.className = 'group-badge' + (g1 ? ` show ${g1}` : '');
  elG1.textContent = g0 ? (g0 === 'solid' ? '全' : '花') : '';
  elG2.textContent = g1 ? (g1 === 'solid' ? '全' : '花') : '';
  elN1.textContent = `你${g0 ? ' · ' + groupLabel(g0) : ''}`;
  elN2.textContent = `电脑 AI${g1 ? ' · ' + groupLabel(g1) : ''}`;
  renderBallStrip(0, elB1);
  renderBallStrip(1, elB2);
  canvas.classList.toggle('ai-turn', matchState === 'playing' && state.player === 1);
  updateSkillUI();
}

/* ==================== 启动 ==================== */
elModeEight.addEventListener('click', beginDiceRoll);
elModePractice.addEventListener('click', startPracticeMode);
document.addEventListener('pointerdown', ensureAudioContext, { passive: true });
elSettingsButton.addEventListener('click', () => {
  elSettingsPanel.hidden = false;
});
elSettingsClose.addEventListener('click', () => {
  elSettingsPanel.hidden = true;
  elSkinList.hidden = true;
});
elSkinPicker.addEventListener('click', () => {
  elSkinList.hidden = !elSkinList.hidden;
});
elSkinClassic.addEventListener('click', () => applyButtonSkin('classic'));
elSkinMonochrome.addEventListener('click', () => applyButtonSkin('monochrome'));
elControlTouch.addEventListener('click', () => applyControlMode('touch'));
elControlMouse.addEventListener('click', () => applyControlMode('mouse'));
elSkillJump.addEventListener('click', () => toggleSkill('jump'));
elSkillLock.addEventListener('click', toggleJumpLock);
elSkillCurve.addEventListener('click', () => toggleSkill('curve'));
elCurveAngle.addEventListener('input', e => {
  skills.curveAngle = Number(e.target.value);
  elCurveAngleLabel.textContent = formatCurveAngle(skills.curveAngle);
  if (skills.arc) {
    state.msg = skills.jump
      ? `跳球 + 弧球：越过阻挡后目标球转弯 ${formatCurveAngle(skills.curveAngle)}`
      : `弧球已启用：目标球将转弯 ${formatCurveAngle(skills.curveAngle)}`;
  }
  updateHUD();
});
elAimJoystick.addEventListener('pointerdown', e => {
  if (!canUseSkills()) return;
  e.preventDefault();
  joystickPointerId = e.pointerId;
  elAimJoystick.setPointerCapture?.(e.pointerId);
  startAimJoystick(e);
});
elAimJoystick.addEventListener('pointermove', e => {
  if (e.pointerId !== joystickPointerId) return;
  e.preventDefault();
  updateAimJoystick(e);
});
elAimJoystick.addEventListener('pointerup', e => {
  if (e.pointerId === joystickPointerId) resetAimJoystick();
});
elAimJoystick.addEventListener('pointercancel', resetAimJoystick);
elMobilePower.addEventListener('input', e => {
  mobilePower = Number(e.target.value) / 100;
  power = mobilePower;
  elMobilePowerLabel.textContent = `${Math.round(mobilePower * 100)}%`;
});
elMobileShoot.addEventListener('click', () => {
  if (!canUseSkills() || mobilePower < MIN_SHOT_POWER) return;
  const shotPower = mobilePower;
  mobilePower = 0;
  power = 0;
  doShoot(shotPower);
});
drawDie(elYourDie, 1);
drawDie(elAiDie, 1);
showStartScreen();
applyControlMode(controlMode, false);
applyButtonSkin(buttonSkin, false);
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
